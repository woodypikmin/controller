name: Build Pikmin Pilot Stage 8.0.1 DVT Available XCTest Tap Proof

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build IDevice XCFramework on runner
        run: |
          set -euxo pipefail
          chmod +x scripts/build-idevice-xcframework.sh
          scripts/build-idevice-xcframework.sh

      - name: Verify generated IDevice XCFramework
        run: |
          set -euxo pipefail
          test -f Vendor/IDevice/IDevice.xcframework/Info.plist
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/Headers/idevice.h
          ls -lh Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate
      - name: Verify generated app scheme includes UI tests
        run: |
          set -euxo pipefail
          xcodebuild -project PikminPilot.xcodeproj -list
          xcodebuild -project PikminPilot.xcodeproj -list -json > xcode-list.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("xcode-list.json").read_text())
          project = data.get("project", {})
          targets = set(project.get("targets", []))
          schemes = set(project.get("schemes", []))

          required_targets = {
              "PikminPilot",
              "PikminPilotRunnerUITests",
          }

          missing = required_targets - targets
          if missing:
              raise SystemExit(
                  "Missing target(s): " + ", ".join(sorted(missing))
              )

          if "PikminPilot" not in schemes:
              raise SystemExit("Existing PikminPilot scheme is missing")

          print("PikminPilot app scheme + UI test target verified.")
          PY

      - name: Build unsigned iPhone app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned XCUITest Runner
        run: |
          set -euxo pipefail
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-runner \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          RUNNER_APP="$(find build-runner/Build/Products -type d -name '*-Runner.app' -print -quit)"
          test -n "$RUNNER_APP"
          test -d "$RUNNER_APP"

          echo "RUNNER_APP=$RUNNER_APP" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_APP/Info.plist" \
            | tee RunnerBundleIdentifier.txt
          plutil -p "$RUNNER_APP/Info.plist" > RunnerInfoPlist.txt

          TEST_BUNDLE="$(find "$RUNNER_APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          test -n "$TEST_BUNDLE"
          test -d "$TEST_BUNDLE"
          TEST_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$TEST_BUNDLE/Info.plist")"
          test -n "$TEST_EXEC"
          test -f "$TEST_BUNDLE/$TEST_EXEC"
          {
            echo "RUNNER_APP=$RUNNER_APP"
            echo "TEST_BUNDLE=$TEST_BUNDLE"
            echo "TEST_EXEC=$TEST_EXEC"
            file "$TEST_BUNDLE/$TEST_EXEC"
            ls -lh "$TEST_BUNDLE/$TEST_EXEC"
          } | tee RunnerNestedXCTestLayout.txt

      - name: Package unsigned XCUITest Runner IPA
        run: |
          set -euxo pipefail
          test -n "${RUNNER_APP:-}"
          rm -rf RunnerPayload
          mkdir RunnerPayload
          cp -R "$RUNNER_APP" RunnerPayload/
          mv RunnerPayload Payload
          /usr/bin/zip -qry PikminPilotRunner-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned.ipa Payload
          rm -rf Payload

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PikminPilot.app Payload/
          /usr/bin/zip -qry PikminPilot-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned
          path: PikminPilot-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilotRunner-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned
          path: |
            PikminPilotRunner-Stage8.0.1-DVT-Available-XCTest-Tap-Proof-unsigned.ipa
            RunnerBundleIdentifier.txt
            RunnerInfoPlist.txt
            RunnerNestedXCTestLayout.txt
