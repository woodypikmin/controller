name: Build Pikmin Pilot Stage 10.2 Polished Control + Pink Count + Speed

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify embedded signed Runner fallback payload
        run: |
          set -euxo pipefail
          RUNNER_IPA="EmbeddedRunner/PikminPilotRunner-signed.ipa"
          test -f "$RUNNER_IPA"
          test -s "$RUNNER_IPA"
          unzip -t "$RUNNER_IPA" >/dev/null

          rm -rf EmbeddedRunnerCheck
          mkdir EmbeddedRunnerCheck
          unzip -q "$RUNNER_IPA" -d EmbeddedRunnerCheck
          RUNNER_APP="$(find EmbeddedRunnerCheck/Payload -maxdepth 1 -type d -name '*-Runner.app' -print -quit)"
          test -n "$RUNNER_APP"
          test -d "$RUNNER_APP"
          test -f "$RUNNER_APP/embedded.mobileprovision"
          test -d "$RUNNER_APP/_CodeSignature"

          TEST_BUNDLE="$(find "$RUNNER_APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          test -n "$TEST_BUNDLE"
          test -d "$TEST_BUNDLE/_CodeSignature"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_APP/Info.plist" | tee EmbeddedRunnerBundleIdentifier.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_BUNDLE/Info.plist" | tee EmbeddedXCTestBundleIdentifier.txt
          shasum -a 256 "$RUNNER_IPA" | tee EmbeddedRunnerSHA256.txt

          security cms -D -i "$RUNNER_APP/embedded.mobileprovision" > EmbeddedRunnerProvisioning.plist
          python3 - <<'PYMETA'
          import plistlib
          from pathlib import Path
          src = plistlib.loads(Path("EmbeddedRunnerProvisioning.plist").read_bytes())
          ent = src.get("Entitlements", {}) or {}
          team_ids = src.get("TeamIdentifier") or [ent.get("com.apple.developer.team-identifier", "")]
          out = {
              "ExpirationDate": src.get("ExpirationDate"),
              "CreationDate": src.get("CreationDate"),
              "TeamIdentifier": team_ids[0] if team_ids else "",
              "ApplicationIdentifier": ent.get("application-identifier", ""),
              "ProfileName": src.get("Name", ""),
          }
          Path("PikminPilotEmbeddedRunnerMetadata.plist").write_bytes(plistlib.dumps(out, fmt=plistlib.FMT_XML))
          print(out)
          PYMETA
          rm -rf EmbeddedRunnerCheck

      - name: Build IDevice XCFramework on runner
        run: |
          set -euxo pipefail
          chmod +x scripts/build-idevice-xcframework.sh
          scripts/build-idevice-xcframework.sh

      - name: Verify generated IDevice XCFramework
        run: |
          set -euxo pipefail
          test -f Vendor/IDevice/IDevice.xcframework/Info.plist
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/Headers/idevice.h
          ls -lh Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Verify generated targets
        run: |
          set -euxo pipefail
          xcodebuild -project PikminPilot.xcodeproj -list -json > xcode-list.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("xcode-list.json").read_text())
          project = data.get("project", {})
          targets = set(project.get("targets", []))
          required = {"PikminPilot", "PikminPilotRunnerUITests"}
          missing = required - targets
          if missing:
              raise SystemExit("Missing target(s): " + ", ".join(sorted(missing)))
          print("Stage 10.2 targets verified")
          PY

      - name: Build unsigned iPhone host app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP="build/Build/Products/Release-iphoneos/PikminPilot.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee AppBundleIdentifier.txt

      - name: Embed currently signed Runner fallback into host app bundle
        run: |
          set -euxo pipefail
          APP="build/Build/Products/Release-iphoneos/PikminPilot.app"
          cp EmbeddedRunner/PikminPilotRunner-signed.ipa "$APP/PikminPilotEmbeddedRunner.ipa"
          cp PikminPilotEmbeddedRunnerMetadata.plist "$APP/PikminPilotEmbeddedRunnerMetadata.plist"
          test -s "$APP/PikminPilotEmbeddedRunner.ipa"
          test -s "$APP/PikminPilotEmbeddedRunnerMetadata.plist"
          cmp EmbeddedRunner/PikminPilotRunner-signed.ipa "$APP/PikminPilotEmbeddedRunner.ipa"
          shasum -a 256 "$APP/PikminPilotEmbeddedRunner.ipa" | tee AppEmbeddedRunnerSHA256.txt
          echo "NOTE: embedded payload is the last signed stable fallback. For 6...12 pink-count + speed control, sign/install the Stage 10.2 Runner artifact once."

      - name: Package Pikmin Pilot IPA
        run: |
          set -euxo pipefail
          APP="build/Build/Products/Release-iphoneos/PikminPilot.app"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry PikminPilot-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned.ipa Payload
          rm -rf Payload

      - name: Build unsigned Stage 10.2 XCUITest Runner
        run: |
          set -euxo pipefail
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-runner \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          RUNNER_APP="$(find build-runner/Build/Products -type d -name '*-Runner.app' -print -quit)"
          test -n "$RUNNER_APP"
          test -d "$RUNNER_APP"
          echo "RUNNER_APP=$RUNNER_APP" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_APP/Info.plist" | tee RunnerBundleIdentifier.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_APP/Info.plist" | tee RunnerBundleVersion.txt || true
          plutil -p "$RUNNER_APP/Info.plist" > RunnerInfoPlist.txt

          TEST_BUNDLE="$(find "$RUNNER_APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          test -n "$TEST_BUNDLE"
          TEST_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$TEST_BUNDLE/Info.plist")"
          test -f "$TEST_BUNDLE/$TEST_EXEC"
          {
            echo "RUNNER_APP=$RUNNER_APP"
            echo "TEST_BUNDLE=$TEST_BUNDLE"
            echo "TEST_EXEC=$TEST_EXEC"
            file "$TEST_BUNDLE/$TEST_EXEC"
            ls -lh "$TEST_BUNDLE/$TEST_EXEC"
          } | tee RunnerNestedXCTestLayout.txt

      - name: Package unsigned Stage 10.2 Runner IPA
        run: |
          set -euxo pipefail
          test -n "${RUNNER_APP:-}"
          rm -rf Payload
          mkdir Payload
          cp -R "$RUNNER_APP" Payload/
          /usr/bin/zip -qry PikminPilotRunner-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned
          path: |
            PikminPilot-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned.ipa
            AppBundleIdentifier.txt
            EmbeddedRunnerBundleIdentifier.txt
            EmbeddedXCTestBundleIdentifier.txt
            EmbeddedRunnerSHA256.txt
            AppEmbeddedRunnerSHA256.txt
            PikminPilotEmbeddedRunnerMetadata.plist

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilotRunner-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned
          path: |
            PikminPilotRunner-Stage10.2-Polished-Control-Pink-Count-Speed-unsigned.ipa
            RunnerBundleIdentifier.txt
            RunnerBundleVersion.txt
            RunnerInfoPlist.txt
            RunnerNestedXCTestLayout.txt
