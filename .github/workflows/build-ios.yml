
name: Build Pikmin Pilot Stage 7.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-app:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PikminPilot.app Payload/
          zip -qry PikminPilot-Stage7.0-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Stage7.0-unsigned
          path: PikminPilot-Stage7.0-unsigned.ipa

  build-idevice:
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build idevice XCFramework
        run: ./scripts/build-idevice-xcframework.sh

      - uses: actions/upload-artifact@v4
        with:
          name: IDevice-xcframework
          path: Vendor/IDevice/IDevice.xcframework
