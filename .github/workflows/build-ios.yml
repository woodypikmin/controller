name: Build Pikmin Pilot Stage 7.1.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build IDevice XCFramework on runner
        run: |
          set -euxo pipefail
          chmod +x scripts/build-idevice-xcframework.sh
          scripts/build-idevice-xcframework.sh

      - name: Verify generated IDevice XCFramework
        run: |
          set -euxo pipefail
          test -f Vendor/IDevice/IDevice.xcframework/Info.plist
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/Headers/idevice.h
          ls -lh Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PikminPilot.app Payload/
          /usr/bin/zip -qry PikminPilot-Stage7.1.3-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Stage7.1.3-unsigned
          path: PikminPilot-Stage7.1.3-unsigned.ipa
