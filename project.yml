
name: PikminPilot

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.4"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.4

targets:
  PikminPilot:
    type: application
    platform: iOS

    sources:
      - path: PikminPilot

    info:
      path: PikminPilot/Info.plist

    dependencies:
      - framework: Vendor/IDevice/IDevice.xcframework
      - sdk: Foundation.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PikminPilot
        PRODUCT_NAME: PikminPilot
        TARGETED_DEVICE_FAMILY: "1"

        SWIFT_OBJC_BRIDGING_HEADER: PikminPilot/PikminPilot-Bridging-Header.h

        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/PikminPilot"
          - "$(PROJECT_DIR)/Vendor/IDevice/IDevice.xcframework/ios-arm64/Headers"

        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"

        CODE_SIGN_STYLE: Automatic

  PikminPilotRunnerUITests:
    type: bundle.ui-testing
    platform: iOS

    sources:
      - path: PikminPilotRunnerUITests

    dependencies:
      - target: PikminPilot

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PikminPilotRunnerUITests
        PRODUCT_NAME: PikminPilotRunnerUITests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: PikminPilot
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  PikminPilotRunnerUITests:
    build:
      targets:
        PikminPilot: all
        PikminPilotRunnerUITests: [test]
    test:
      targets:
        - PikminPilotRunnerUITests
