
name: PikminPilot

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.4"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.4

targets:
  PikminPilot:
    type: application
    platform: iOS
    sources:
      - path: PikminPilot
    info:
      path: PikminPilot/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PikminPilot
        PRODUCT_NAME: PikminPilot
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
