
name: PikminController
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PikminController:
    type: application
    platform: iOS
    sources:
      - PikminController
    info:
      path: PikminController/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PikminController
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
